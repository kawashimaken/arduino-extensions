[env:uno]
platform = atmelavr
board = uno
framework = arduino
monitor_speed = 115200
lib_deps =
    arduino-libraries/Ethernet@2.0.2

; One socket gets all 8 KB of W5100 RX memory (the TCP window is its free space).
; DNS runs before the radio TCP connects; DHCP renewal briefly stops the stream.
extra_scripts = pre:configure_ethernet.py
build_flags =
    -DMAX_SOCK_NUM=1
    -DETHERNET_LARGE_BUFFERS
